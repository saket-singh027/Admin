syntax="proto3";

package auth;

service AuthService {
    rpc GenerateToken (AuthRequest) returns (AuthResponse); // Generate token is the name of service to hit.
}

message AuthRequest {
    string userId = 1;
    string password = 2 ;
    string role =3;
    string ipAddress = 4;
    string postmanId= 5;
}

message AuthResponse {
    string token = 1;
    string message = 2;
}
